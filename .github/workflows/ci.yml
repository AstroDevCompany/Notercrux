name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @notercrux/desktop build # Tauri's build script needs the frontend dist
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  postgres:
    # Runs the server and sync-engine tests against a real PostgreSQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ncx
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ncx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ncx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOTERCRUX_TEST_DATABASE_URL: postgres://ncx@127.0.0.1:5432/ncx_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p notercrux-sync-server -p notercrux-sync

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-no-em-dashes.sh
      - run: pnpm exec prettier --check . '!Implementation'
      - run: pnpm exec eslint .
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
