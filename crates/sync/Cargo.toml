[package]
name = "notercrux-sync"
description = "Sync client engine: encrypted operation exchange, enrollment, revocation, recovery, retry and observability."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notercrux-crypto = { path = "../crypto" }
notercrux-protocol = { path = "../protocol" }
notercrux-storage = { path = "../storage" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
notercrux-sync-server = { path = "../../apps/sync-server" }
notercrux-domain = { path = "../domain" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
