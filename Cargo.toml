[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/storage",
  "crates/crypto",
  "crates/sync",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/notercrux/notercrux"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
