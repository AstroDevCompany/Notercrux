name: Notercrux
options:
  bundleIdPrefix: app.notercrux
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: JUQ9UN9NM7
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
targets:
  Notercrux:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core/notercrux_mobile.swift
    dependencies:
      - framework: Core/NotercruxCore.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notercrux.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notercrux
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'Notercrux connects to a sync server on your local network when you choose one.'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.0.1
        OTHER_LDFLAGS: '-lc++'
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  NotercruxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Notercrux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.notercrux.ios.tests
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Notercrux.app/Notercrux'
        BUNDLE_LOADER: '$(TEST_HOST)'
  NotercruxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Notercrux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.notercrux.ios.uitests
        TEST_TARGET_NAME: Notercrux
schemes:
  Notercrux:
    build:
      targets:
        Notercrux: all
    test:
      targets:
        - NotercruxTests
        - NotercruxUITests
